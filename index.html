<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>4A Sports Academy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{margin:0;padding:0;}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#EFEFEF;color:#111;-webkit-tap-highlight-color:transparent;overflow-x:hidden;margin:0;padding:0;}

/* LOGIN */
#loginScreen{display:flex;position:fixed;inset:0;background:#fff;flex-direction:column;align-items:center;justify-content:center;padding:2rem;z-index:200;}
.login-logo{width:72px;height:72px;background:#111;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:1.5rem;}
.login-title{font-size:26px;font-weight:700;color:#111;margin-bottom:4px;}
.login-sub{font-size:14px;color:#bbb;margin-bottom:2rem;}
.login-field{width:100%;max-width:320px;padding:14px 16px;border:1.5px solid #eee;border-radius:12px;font-size:16px;font-family:inherit;outline:none;margin-bottom:12px;background:#fafafa;}
.login-field:focus{border-color:#111;background:#fff;}
.login-btn{width:100%;max-width:320px;padding:15px;background:#111;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;}
.login-error{font-size:13px;color:#e74c3c;margin-top:10px;min-height:18px;text-align:center;}

/* APP SHELL */
#appShell{display:none;padding-bottom:72px;}
.screen{display:none;}
.screen.active{display:block;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:none;z-index:50;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 10px;cursor:pointer;color:#ccc;font-size:10px;font-weight:600;gap:3px;border:none;background:none;letter-spacing:0.02em;}
.nav-item.active{color:#111;}
.nav-icon{font-size:22px;line-height:1;}

/* PAGE HEADER */
.pg-header{background:#fff;padding:8px 16px 10px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10;}
.pg-label{font-size:10px;font-weight:700;color:#bbb;letter-spacing:0.12em;text-transform:uppercase;}
.pg-title{font-size:24px;font-weight:700;color:#111;margin-top:2px;}
.pg-header-row{display:flex;justify-content:space-between;align-items:flex-end;}
.add-hdr-btn{padding:7px 14px;background:#111;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.sign-out-btn{font-size:12px;color:#aaa;border:1.5px solid #eee;padding:6px 12px;border-radius:8px;background:#fff;cursor:pointer;font-family:inherit;}

/* DATE NAV */
.date-nav{display:flex;align-items:center;gap:8px;margin-top:8px;}
.date-nav-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid #eee;background:#f4f4f2;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;flex-shrink:0;}
.date-nav-btn:disabled{opacity:0.3;cursor:default;}
#dateLabel{flex:1;text-align:center;font-size:13px;font-weight:600;color:#111;}

/* SESSION TABS */
.sess-tabs{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;}
.sess-tab{flex:1;padding:10px;font-size:13px;font-weight:600;border:1.5px solid #ddd;border-radius:12px;background:#fff;color:#aaa;cursor:pointer;text-align:center;}
.sess-tab.active{background:#111;color:#fff;border-color:#111;}

/* SPORT CHIPS */
.sport-chips{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;scrollbar-width:none;}
.sport-chips::-webkit-scrollbar{display:none;}
.sport-chip{flex-shrink:0;padding:6px 18px;font-size:13px;border:1.5px solid #e8e8e8;border-radius:20px;background:#fff;color:#aaa;cursor:pointer;font-weight:500;}
.sport-chip.active{background:#f4f4f2;color:#111;border-color:#ccc;font-weight:700;}

/* SUMMARY CARDS */
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px;}
.sum-card{background:#fff;border-radius:14px;padding:14px;border:1px solid #eee;}
.sum-val{font-size:26px;font-weight:700;}
.sum-label{font-size:10px;color:#bbb;margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
.sum-card.total .sum-val{color:#111;}
.sum-card.present .sum-val{color:#27ae60;}
.sum-card.absent .sum-val{color:#e74c3c;}

/* STUDENT CARD */
.list-area{padding:0 16px;}
.s-card{background:#fff;border:1px solid #eee;border-radius:16px;margin-bottom:8px;overflow:hidden;}
.s-row{display:flex;align-items:center;padding:13px 14px;gap:12px;cursor:pointer;}
.avatar{width:42px;height:42px;border-radius:50%;background:#f4f4f2;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#666;flex-shrink:0;}
.s-info{flex:1;min-width:0;}
.s-name{font-size:15px;font-weight:600;color:#111;}
.s-sub{font-size:12px;color:#bbb;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-group{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.pa-btn{width:44px;height:44px;border-radius:12px;border:none;cursor:pointer;font-size:17px;font-weight:800;}
.pa-btn.p{background:#111;color:#fff;}
.pa-btn.a{background:#ffe5e5;color:#e74c3c;}
.call-link{width:44px;height:44px;border-radius:12px;background:#fff0f0;display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;}
.expand-panel{padding:0 14px 14px;border-top:1px solid #f5f5f5;}
.d-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f8f8f8;}
.d-row:last-child{border:none;}
.d-key{font-size:12px;color:#bbb;}
.d-val{font-size:13px;font-weight:500;color:#111;}

/* ADD STUDENT BTN */
.add-student-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:4px 0 16px;padding:14px;border:1.5px dashed #ddd;border-radius:14px;background:#fff;color:#bbb;font-size:14px;font-weight:500;cursor:pointer;}

/* SAVE BAR */
.save-bar{position:fixed;bottom:72px;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:9;}
.saved-msg{flex:1;font-size:12px;color:#27ae60;font-weight:600;}
.save-btn{padding:12px 24px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}

/* DASHBOARD */
.dash-hero{background:#111;margin:14px 16px;border-radius:18px;padding:18px;color:#fff;}
.dash-date{font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:4px;}
.dash-name{font-size:20px;font-weight:700;}
.dash-quote{font-size:12px;color:rgba(255,255,255,0.45);margin-top:10px;line-height:1.6;font-style:italic;}
.dash-section{padding:0 16px 4px;}
.dash-section-title{font-size:10px;font-weight:700;color:#bbb;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px;margin-top:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.stat-card{background:#fff;border-radius:14px;padding:14px;border:1px solid #eee;}
.stat-num{font-size:24px;font-weight:700;}
.stat-num.green{color:#27ae60;}
.stat-num.red{color:#e74c3c;}
.stat-num.amber{color:#e67e22;}
.stat-num.dark{color:#111;}
.stat-num.blue{color:#2980b9;}
.stat-label{font-size:10px;color:#bbb;margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
.batch-card{background:#fff;border:1px solid #eee;border-radius:14px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.bc-name{font-size:14px;font-weight:600;color:#111;}
.bc-sub{font-size:12px;color:#bbb;margin-top:2px;}
.bc-bar{height:3px;background:#eee;border-radius:2px;margin-top:8px;width:120px;}
.bc-fill{height:3px;background:#27ae60;border-radius:2px;}
.bc-count{font-size:22px;font-weight:700;color:#27ae60;}
.bc-total{font-size:11px;color:#bbb;text-align:right;}

/* PROFILES */
.search-bar{padding:10px 16px;background:#fff;border-bottom:1px solid #eee;}
.search-input{width:100%;padding:11px 14px;border:1.5px solid #eee;border-radius:12px;font-size:14px;background:#f7f7f5;color:#111;outline:none;font-family:inherit;}
.filter-row{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{flex-shrink:0;padding:5px 14px;font-size:12px;border:1.5px solid #eee;border-radius:20px;background:#fff;color:#aaa;cursor:pointer;font-weight:500;}
.filter-chip.active{background:#111;color:#fff;border-color:#111;}
.profile-list{padding:12px 16px;}
.profile-card{background:#fff;border:1px solid #eee;border-radius:16px;margin-bottom:8px;overflow:hidden;cursor:pointer;}
.profile-row{display:flex;align-items:center;padding:13px 14px;gap:12px;}
.profile-info{flex:1;min-width:0;}
.profile-name{font-size:15px;font-weight:600;color:#111;}
.profile-sub{font-size:12px;color:#bbb;margin-top:2px;}
.fee-pill{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.fee-pill.paid{background:#e8f5e9;color:#27ae60;}
.fee-pill.unpaid{background:#fdecea;color:#e74c3c;}
.fee-pill.partial{background:#fff3e0;color:#e67e22;}

/* PROFILE DETAIL */
#profileDetail{position:fixed;inset:0;background:#EFEFEF;z-index:100;display:none;overflow-y:auto;padding-bottom:2rem;}
.detail-header{background:#fff;padding:14px 16px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;}
.back-btn{width:36px;height:36px;border:1.5px solid #eee;border-radius:10px;background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;}
.detail-hero{background:#111;margin:14px 16px;border-radius:16px;padding:18px;color:#fff;display:flex;align-items:center;gap:14px;}
.detail-avatar{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;}
.detail-stud-name{font-size:18px;font-weight:700;}
.detail-stud-sub{font-size:13px;color:rgba(255,255,255,0.55);margin-top:3px;}
.info-card{background:#fff;border:1px solid #eee;border-radius:14px;margin:0 16px 12px;overflow:hidden;}
.info-card-title{font-size:10px;font-weight:700;color:#bbb;letter-spacing:0.1em;text-transform:uppercase;padding:12px 14px 8px;border-bottom:1px solid #f5f5f5;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f8f8f8;}
.info-row:last-child{border:none;}
.info-key{font-size:13px;color:#aaa;}
.info-val{font-size:13px;font-weight:500;text-align:right;color:#111;}
.fee-action-row{display:flex;gap:8px;padding:0 16px 12px;}
.fee-action-btn{flex:1;padding:12px;border:1.5px solid #ddd;border-radius:12px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;}
.fee-action-btn.primary{background:#111;color:#fff;border-color:#111;}
.fee-history-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f8f8f8;}
.fee-history-row:last-child{border:none;}
.fhr-amount{font-size:14px;font-weight:700;color:#27ae60;}
.fhr-date{font-size:12px;color:#bbb;margin-top:1px;}
.fhr-mode{font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;background:#f4f4f2;color:#555;}
.profile-tab-row{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;scrollbar-width:none;}
.profile-tab-row::-webkit-scrollbar{display:none;}
.ptab{flex-shrink:0;padding:7px 16px;font-size:13px;font-weight:500;border:1.5px solid #ddd;border-radius:20px;background:#fff;color:#aaa;cursor:pointer;}
.ptab.active{background:#111;color:#fff;border-color:#111;}

/* SKILLS */
.perf-section{padding:14px 16px;}
.perf-title{font-size:10px;font-weight:700;color:#bbb;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px;}
.skill-row{display:flex;align-items:center;margin-bottom:12px;}
.skill-name{font-size:13px;color:#111;width:100px;flex-shrink:0;}
.skill-stars{display:flex;gap:4px;flex:1;}
.star{font-size:22px;cursor:pointer;}
.skill-val{font-size:12px;font-weight:700;color:#bbb;width:28px;text-align:right;}
.month-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:14px;}
.month-tabs::-webkit-scrollbar{display:none;}
.month-tab{flex-shrink:0;padding:6px 14px;font-size:12px;border:1.5px solid #ddd;border-radius:20px;background:#fff;color:#aaa;cursor:pointer;}
.month-tab.active{background:#111;color:#fff;border-color:#111;}
.prog-bar-wrap{margin-bottom:10px;}
.prog-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
.prog-label span:first-child{color:#aaa;}
.prog-label span:last-child{font-weight:600;color:#111;}
.prog-track{height:6px;background:#eee;border-radius:3px;overflow:hidden;}
.prog-fill{height:6px;border-radius:3px;}
.quarter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
.quarter-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:10px 8px;text-align:center;}
.quarter-label{font-size:10px;color:#bbb;font-weight:600;text-transform:uppercase;margin-bottom:4px;}
.quarter-score{font-size:18px;font-weight:700;color:#111;}
.quarter-sub{font-size:10px;color:#bbb;margin-top:1px;}
.trend-up{color:#27ae60;}
.trend-down{color:#e74c3c;}
.trend-same{color:#bbb;}

/* REPORT CARD */
#reportCardView{position:fixed;inset:0;background:#EFEFEF;z-index:200;display:none;overflow-y:auto;padding-bottom:2rem;}
.rc-header{background:#111;padding:1.5rem 1rem;text-align:center;color:#fff;}
.rc-logo{font-size:36px;margin-bottom:6px;}
.rc-academy{font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.5);}
.rc-title{font-size:20px;font-weight:700;margin-top:4px;}
.rc-period{font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;}
.rc-student-block{background:#fff;margin:14px 16px;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;}
.rc-avatar{width:52px;height:52px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;}
.rc-stud-name{font-size:17px;font-weight:700;}
.rc-stud-sub{font-size:12px;color:#bbb;margin-top:2px;}
.rc-skill-block{background:#fff;margin:0 16px 12px;border-radius:14px;padding:14px;}
.rc-skill-title{font-size:10px;font-weight:700;color:#bbb;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px;}
.rc-skill-item{margin-bottom:12px;}
.rc-skill-label{display:flex;justify-content:space-between;margin-bottom:4px;}
.rc-skill-label span:first-child{font-size:13px;color:#111;font-weight:500;}
.rc-skill-label span:last-child{font-size:12px;font-weight:700;color:#111;}
.rc-track{height:8px;background:#eee;border-radius:4px;overflow:hidden;}
.rc-fill{height:8px;border-radius:4px;}
.rc-overall{background:#111;margin:0 16px 12px;border-radius:14px;padding:14px;text-align:center;color:#fff;}
.rc-overall-num{font-size:48px;font-weight:700;}
.rc-overall-label{font-size:12px;color:rgba(255,255,255,0.5);margin-top:4px;text-transform:uppercase;letter-spacing:0.06em;}
.rc-grade{font-size:18px;font-weight:700;margin-top:8px;}
.rc-note{background:#fff;margin:0 16px 12px;border-radius:14px;padding:14px;}
.rc-note-label{font-size:10px;font-weight:700;color:#bbb;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;}
.rc-note-text{font-size:14px;color:#111;line-height:1.6;}
.rc-close-btn{margin:0 16px;width:calc(100% - 32px);padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}



/* BOOKINGS */
.bk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px 12px;}
.bk-stat{background:#fff;border-radius:10px;padding:8px 6px;border:1px solid #eee;}
.bk-stat .sum-val{font-size:14px;font-weight:700;color:#111;}
.bk-stat .sum-label{font-size:9px;color:#bbb;margin-top:1px;font-weight:600;text-transform:uppercase;letter-spacing:0.02em;}
.bk-card{background:#fff;border:1px solid #eee;border-radius:16px;margin-bottom:8px;padding:14px;}
.bk-top{display:flex;justify-content:space-between;align-items:flex-start;}
.bk-name{font-size:15px;font-weight:600;color:#111;}
.bk-sport{font-size:12px;color:#bbb;margin-top:2px;}
.bk-amount{font-size:15px;font-weight:700;color:#27ae60;}
.bk-amount.unpaid{color:#e74c3c;}
.bk-mid{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;}
.bk-badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:#f4f4f2;color:#555;}
.bk-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.bk-phone{font-size:13px;color:#2980b9;font-weight:600;text-decoration:none;}
.bk-date{font-size:11px;color:#ccc;}
.bk-notes{font-size:12px;color:#aaa;margin-top:6px;line-height:1.5;}
.bk-actions{display:flex;gap:6px;margin-top:10px;}
.bk-action-btn{font-size:11px;padding:5px 12px;border:1.5px solid #eee;border-radius:20px;background:#fff;cursor:pointer;font-family:inherit;color:#aaa;font-weight:500;}
.bk-action-btn.paid-btn{background:#e8f5e9;color:#27ae60;border-color:#e8f5e9;}
.bk-action-btn.del-btn{color:#e74c3c;border-color:#fdecea;}
.bk-month-filter{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;scrollbar-width:none;}
.bk-month-filter::-webkit-scrollbar{display:none;}
.bk-list{padding:12px 16px;}
/* INQUIRIES */
.inq-list{padding:12px 16px;}
.inq-card{background:#fff;border:1px solid #eee;border-radius:16px;margin-bottom:8px;padding:14px;}
.inq-top{display:flex;justify-content:space-between;align-items:flex-start;}
.inq-name{font-size:15px;font-weight:600;color:#111;}
.inq-sport{font-size:12px;color:#bbb;margin-top:2px;}
.inq-status{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;flex-shrink:0;}
.inq-status.new{background:#e8f0fe;color:#2980b9;}
.inq-status.called{background:#e8f5e9;color:#27ae60;}
.inq-status.admitted{background:#f3e8fd;color:#8e44ad;}
.inq-status.notinterested{background:#f5f5f5;color:#aaa;}
.inq-bottom{margin-top:10px;display:flex;justify-content:space-between;align-items:center;}
.inq-phone{font-size:13px;color:#2980b9;font-weight:600;text-decoration:none;}
.inq-date{font-size:11px;color:#ccc;}
.inq-notes{font-size:12px;color:#aaa;margin-top:6px;line-height:1.5;}
.status-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.status-btn{font-size:11px;padding:5px 12px;border:1.5px solid #eee;border-radius:20px;background:#fff;cursor:pointer;font-family:inherit;color:#aaa;font-weight:500;}
.status-btn.active-btn{background:#111;color:#fff;border-color:#111;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;display:none;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:1rem 1.25rem 2rem;width:100%;max-height:90vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 1rem;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:1rem;color:#111;}
.field-label{font-size:12px;font-weight:600;color:#aaa;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.05em;}
.modal input,.modal select,.modal textarea{width:100%;padding:12px 14px;border:1.5px solid #eee;border-radius:12px;font-size:15px;font-family:inherit;outline:none;color:#111;background:#fafafa;margin-bottom:14px;}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#111;}
.modal textarea{resize:none;height:80px;}
.modal-btns{display:flex;gap:8px;margin-top:4px;}
.btn-cancel{flex:1;padding:13px;border:1.5px solid #eee;border-radius:12px;background:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;color:#aaa;}

const firebaseApp=firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const auth=firebase.auth();
async function fsSet(path,data){try{var p=path.split('/');await db.collection(p[0]).doc(p[1]).set(data,{merge:true});}catch(e){}}
async function fsGet(path){try{var p=path.split('/');var s=await db.collection(p[0]).doc(p[1]).get();return s.exists?s.data():null;}catch(e){return null;}}
async function loadFromFirebase(){
  try{
    var r=await Promise.all([fsGet('academy/attHistory'),fsGet('academy/bookings'),fsGet('academy/inquiries'),fsGet('academy/meta'),fsGet('academy/inactive')]);
    if(r[0]&&r[0].data) attHistory=JSON.parse(r[0].data);
    if(r[1]&&r[1].data) bookings=JSON.parse(r[1].data);
    if(r[2]&&r[2].data) inquiries=JSON.parse(r[2].data);
    if(r[3]&&r[3].nextId) nextId=r[3].nextId;
    if(r[4]&&r[4].data) inactiveStudents=JSON.parse(r[4].data);
  }catch(e){console.warn('Firebase load error:',e);}
  // Clear working state cache so fresh Firebase data is used
  workingState={};
}
function saveAll(){
  localStorage.setItem('aca_attHistory',JSON.stringify(attHistory));
  localStorage.setItem('aca_inquiries',JSON.stringify(inquiries));
  localStorage.setItem('aca_nextid',JSON.stringify(nextId));
  fsSet('academy/attHistory',{data:JSON.stringify(attHistory)});
  fsSet('academy/inquiries',{data:JSON.stringify(inquiries)});
  fsSet('academy/meta',{nextId:nextId});
}
function saveBk(){
  localStorage.setItem('aca_bookings',JSON.stringify(bookings));
  fsSet('academy/bookings',{data:JSON.stringify(bookings)});
}
function initApp(){
  renderDashboard();updateDateDisplay();renderSportChips();renderStudents();
  renderProfileFilters();renderProfiles();renderBkMonthFilter();renderBookings();renderInqFilters();renderInquiries();
}

function saveAllSkills(id,sess,sp){
  saveAll();
  var b=document.createElement('div');
  b.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#27ae60;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;';
  b.textContent='✓ Skills saved!';
  document.body.appendChild(b);
  setTimeout(function(){b.remove();},2000);
}

function showApp(email){
  loggedInUser=email.split('@')[0];
  localStorage.setItem('aca_user',loggedInUser);
  localStorage.removeItem('aca_attHistory');
  localStorage.removeItem('aca_bookings');
  localStorage.removeItem('aca_inquiries');
  localStorage.removeItem('aca_nextid');
  document.getElementById('loginScreen').style.display='none';
  var loader=document.createElement('div');
  loader.id='fbLoader';
  loader.style.cssText='position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;font-family:-apple-system,sans-serif;';
  loader.innerHTML='<div style="font-size:48px;margin-bottom:16px;">🏆</div><div style="font-size:16px;font-weight:600;color:#111;">Loading...</div>';
  document.body.appendChild(loader);
  loadFromFirebase().then(function(){
    var l=document.getElementById('fbLoader');
    if(l) l.remove();
    document.getElementById('appShell').style.display='block';
    document.getElementById('bottomNav').style.display='flex';
    initApp();
  });
}
function showLoginScreen(){
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('appShell').style.display='none';
  document.getElementById('bottomNav').style.display='none';
}
async function doLogin(){
  var email=document.getElementById('loginUser').value.trim();
  var pass=document.getElementById('loginPass').value;
  if(!email){document.getElementById('loginError').textContent='Please enter email.';return;}
  if(!pass){document.getElementById('loginError').textContent='Please enter password.';return;}
  document.getElementById('loginError').textContent='Signing in...';
  try{
    var r=await auth.signInWithEmailAndPassword(email,pass);
    showApp(r.user.email);
  }catch(e){
    var m={'auth/invalid-email':'Invalid email.','auth/user-not-found':'No account.','auth/wrong-password':'Wrong password.','auth/invalid-credential':'Wrong email or password.','auth/too-many-requests':'Too many attempts.'};
    document.getElementById('loginError').textContent=m[e.code]||'Error: '+e.code;
  }
}
async function doLogout(){
  try{await auth.signOut();}catch(e){}
  localStorage.removeItem('aca_user');
  loggedInUser='';
  document.getElementById('loginPass').value='';
  document.getElementById('loginError').textContent='';
  showLoginScreen();
}
document.addEventListener('DOMContentLoaded',function(){
  auth.onAuthStateChanged(function(user){
    if(user){showApp(user.email);}
    else{showLoginScreen();}
  });
});

function initials(n){return(n||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function keyToDate(k){const[y,m,d]=k.split('-');return new Date(+y,+m-1,+d);}
function fmtKey(k){return keyToDate(k).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
function fmtMoney(n){return '₹'+Number(n).toLocaleString('en-IN');}
function calcAge(dob){if(!dob)return null;const p=dob.split('/');if(p.length!==3)return null;const d=new Date(+p[2],+p[1]-1,+p[0]);if(isNaN(d))return null;const t=new Date();let a=t.getFullYear()-d.getFullYear();const m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a;}
function calcCategory(dob){const a=calcAge(dob);if(a===null)return null;if(a<=8)return{label:'Under-8',short:'U8',color:'#2980b9',bg:'#e8f0fe'};if(a<=10)return{label:'Under-10',short:'U10',color:'#27ae60',bg:'#e8f5e9'};if(a<=12)return{label:'Under-12',short:'U12',color:'#e67e22',bg:'#fff3e0'};if(a<=14)return{label:'Under-14',short:'U14',color:'#e74c3c',bg:'#fdecea'};if(a<=16)return{label:'Under-16',short:'U16',color:'#8e44ad',bg:'#f3e8fd'};if(a<=18)return{label:'Under-18',short:'U18',color:'#00695c',bg:'#e0f2f1'};return{label:'Senior',short:'SR',color:'#555',bg:'#f4f4f2'};}
function getAllStudents(){let all=[];Object.keys(BATCHES).forEach(sess=>Object.keys(students[sess]).forEach(sp=>{students[sess][sp].forEach(st=>all.push({...st,session:sess,sport:sp}));}));return all;}
function getMonthKey(offset=0){const d=new Date();d.setMonth(d.getMonth()-offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function fmtMonthKey(key){const[y,m]=key.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-IN',{month:'short',year:'numeric'});}

let bookings=JSON.parse(localStorage.getItem('aca_bookings')||'null')||JSON.parse(JSON.stringify(DEFAULT_BOOKINGS));
let bkMonthFilter='all';


function renderBkMonthFilter(){
  // Get unique months from bookings
  const months=new Set();
  bookings.forEach(b=>{ if(b.date) months.add(b.date.slice(0,7)); });
  const sorted=[...months].sort().reverse();
  const labels={all:'All'};
  sorted.forEach(m=>{
    const[y,mo]=m.split('-');
    labels[m]=new Date(+y,+mo-1,1).toLocaleDateString('en-IN',{month:'short',year:'numeric'});
  });
  document.getElementById('bkMonthFilter').innerHTML=Object.keys(labels).map(k=>
    `<div class="filter-chip${k===bkMonthFilter?' active':''}" onclick="setBkMonth('${k}')">${labels[k]}</div>`
  ).join('');
}

function setBkMonth(m){bkMonthFilter=m;renderBkMonthFilter();renderBookings();}

function renderBookings(){
  var list=bkMonthFilter==='all'?[].concat(bookings):bookings.filter(function(b){return b.date&&b.date.startsWith(bkMonthFilter);});
  list.sort(function(a,b){return b.date.localeCompare(a.date);});
  var total=list.length;
  var totalAmt=list.reduce(function(s,b){return s+b.amount;},0);
  var onlineTotal=list.reduce(function(s,b){return s+(b.online||0);},0);
  var cashTotal=list.reduce(function(s,b){return s+(b.cash||0);},0);
  var partialCount=list.filter(function(b){return !b.paid&&(b.balance||0)>0&&(b.balance||0)<b.amount;}).length;
  var pending=list.reduce(function(s,b){return s+(b.balance||0);},0);
  document.getElementById('bkStats').innerHTML=
    '<div class="bk-stat"><div class="sum-val">'+total+'</div><div class="sum-label">Bookings</div></div>'+
    '<div class="bk-stat"><div class="sum-val" style="color:#111;">&#8377;'+totalAmt.toLocaleString('en-IN')+'</div><div class="sum-label">Total</div></div>'+
    '<div class="bk-stat"><div class="sum-val" style="color:#2980b9;">&#8377;'+onlineTotal.toLocaleString('en-IN')+'</div><div class="sum-label">Online</div></div>'+
    '<div class="bk-stat"><div class="sum-val" style="color:#555;">&#8377;'+cashTotal.toLocaleString('en-IN')+'</div><div class="sum-label">Cash</div></div>'+
    '<div class="bk-stat"><div class="sum-val" style="color:#e67e22;">'+partialCount+'</div><div class="sum-label">Partial</div></div>'+
    '<div class="bk-stat"><div class="sum-val" style="color:#e74c3c;">&#8377;'+pending.toLocaleString('en-IN')+'</div><div class="sum-label">Pending</div></div>';
  var groups={};
  list.forEach(function(bk){if(!groups[bk.date])groups[bk.date]=[];groups[bk.date].push(bk);});
  var html='';
  Object.keys(groups).sort().reverse().forEach(function(d){
    var dt=new Date(d+'T00:00:00');
    var label=dt.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}).toUpperCase();
    html+='<div style="font-size:10px;font-weight:700;color:#bbb;letter-spacing:.1em;padding:10px 2px 4px;">'+label+'</div>';
    groups[d].forEach(function(bk){
      var ini=(bk.team||'?').split(' ').slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase();
      var amtPaid=(bk.online||0)+(bk.cash||0);
      var isPartial=!bk.paid&&(bk.balance||0)>0&&(bk.balance||0)<bk.amount;
      var statusColor=bk.paid?'#27ae60':isPartial?'#e67e22':'#e74c3c';
      var statusText=bk.paid?'&#10003; Paid':isPartial?'&#9888; Partial &#8377;'+(bk.balance||0).toLocaleString('en-IN'):'&#10007; Unpaid';
      var isOpen=(bkExpandedId===bk.id);

    <div class="dash-section-title">Batch Overview</div>

    <div class="grid3"><div class="stat-card"><div class="stat-num green">${fPaid}</div><div class="stat-label">Paid</div></div><div class="stat-card"><div class="stat-num amber">${fPartial}</div><div class="stat-label">Partial</div></div><div class="stat-card"><div class="stat-num red">${fUnpaid}</div><div class="stat-label">Unpaid</div></div></div>
    <div class="dash-section-title">Quick Stats</div>

    <div class="dash-section-title">This Month Bookings</div>

function updateDateDisplay(){
  const isToday=selDate.getTime()===todayDate.getTime();
  const label=(isToday?'Today  ':'')+selDate.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});
  document.getElementById('dateLabel').textContent=label;
  const tomorrow=new Date(selDate); tomorrow.setDate(tomorrow.getDate()+1);
  document.getElementById('nextDateBtn').disabled=(tomorrow>todayDate);
}
function changeDate(dir){
  const next=new Date(selDate); next.setDate(next.getDate()+dir);
  if(next>todayDate)return;
  selDate=next; expandedId=null; updateDateDisplay(); renderStudents();
}
function switchSession(s,el){
  session=s; sport=BATCHES[s][0]; expandedId=null;
  document.querySelectorAll('.sess-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderSportChips(); renderStudents();
}
function renderSportChips(){
  document.getElementById('sportChips').innerHTML=BATCHES[session].map(b=>`<div class="sport-chip${sport===b?' active':''}" onclick="selectSport('${b}')">${b}</div>`).join('');
}
function selectSport(s){sport=s;expandedId=null;renderSportChips();renderStudents();}

function wsKey(){return dateKey(selDate)+'_'+session+'_'+sport;}
function getStudentsForDate(){
  var dk = dateKey(selDate);
  // Check if saved record exists for this date
  var saved = attHistory.find(function(h){
    return h.date===dk && h.session===session && h.sport===sport;
  });
  if(saved && saved.students && saved.students.length>0){
    return saved.students.map(function(s){
      return {id:s.id,studName:s.studName||'',name:s.studName||'',phone:'',dob:'',present:s.present,comment:s.comment||''};
    });
  }
  // No record for this date - use most recent past record, all present
  var recent=attHistory.filter(function(h){
    return h.session===session&&h.sport===sport&&h.date<dk;
  }).sort(function(a,b){return b.date.localeCompare(a.date);})[0];
  if(recent&&recent.students&&recent.students.length>0){
    return recent.students.map(function(s){
      return {id:s.id,studName:s.studName||'',name:s.studName||'',phone:'',dob:'',present:true,comment:''};
    });
  }
  // Final fallback - PER_MONTH_STUDENTS
  var monthKey=dk.slice(0,7);
  var mData=PER_MONTH_STUDENTS[monthKey];
  if(!mData){
    var keys=Object.keys(PER_MONTH_STUDENTS).sort().reverse();
    mData=PER_MONTH_STUDENTS[keys[0]];
  }
  if(sport==='Basketball') return (mData&&mData[session+'_bball'])||[];
  return (mData&&mData[session])||[];
}

function getStudentPhone(id){
  var allSess=['morning','evening'];
  var allSp=['Football','Basketball','Cricket'];
  for(var i=0;i<allSess.length;i++){
    for(var j=0;j<allSp.length;j++){
      var l=(students[allSess[i]]&&students[allSess[i]][allSp[j]])||[];
      var f=l.find(function(s){return s.id===id;});
      if(f&&f.phone) return f.phone;
      var dl=(DEFAULT_STUDENTS[allSess[i]]&&DEFAULT_STUDENTS[allSess[i]][allSp[j]])||[];
      var df=dl.find(function(s){return s.id===id;});
      if(df&&df.phone) return df.phone;
    }
  }
  return '';
}
function getWS(){
  var k=wsKey();
  if(!workingState[k]){
    var monthList=getStudentsForDate();
    workingState[k]=monthList.map(function(st){
      var phone=st.phone||getStudentPhone(st.id)||'';
      return {
        id:st.id,
        studName:st.studName||st.name||'',
        phone:phone,
        dob:st.dob||'',
        present:st.present!==undefined?st.present:true,
        comment:st.comment||''
      };
    });
  }
  return workingState[k];
}

function getMonthAttCount(studId){
  var dk=dateKey(selDate);
  var monthKey=dk.slice(0,7);
  var attended=0;
  var total=0;
  attHistory.forEach(function(h){
    if(h.date.startsWith(monthKey)&&h.session===session&&h.sport===sport){
      total++;
      var s=h.students.find(function(x){return x.id===studId;});
      if(s&&s.present) attended++;
    }
  });
  return {attended:attended,total:total};
}
function getBatchKey(){return wsKey();}
function isInactiveSt(id){
  var bk=getBatchKey();
  return (inactiveStudents[bk]||[]).indexOf(id)!==-1;
}
function removeFromBatch(id){
  var ws=getWS();
  var st=ws.find(function(s){return s.id===id;});
  var name=st?(st.studName||'this student'):'this student';
  if(!confirm('Remove '+name+' from attendance?\nThey will stay in Profiles.')) return;
  // Remove from all future attHistory records
  var dk=dateKey(selDate);
  attHistory.forEach(function(h){
    if(h.session===session&&h.sport===sport&&h.date>=dk){
      h.students=h.students.filter(function(s){return s.id!==id;});
    }
  });
  // Also remove from workingState
  var bk=getBatchKey();
  workingState[bk]=workingState[bk]?workingState[bk].filter(function(s){return s.id!==id;}):[];
  expandedAttId=null;
  saveAll();
  renderStudents();
}
function setActive(id){
  var bk=getBatchKey();
  if(inactiveStudents[bk]){
    inactiveStudents[bk]=inactiveStudents[bk].filter(function(x){return x!==id;});
    localStorage.setItem('aca_inactive',JSON.stringify(inactiveStudents));
  }
  renderStudents();
}
function toggleAttExpand(id){
  expandedAttId=expandedAttId===id?null:id;
  renderStudents();
}
function toggleInactiveView(){
  var btn=document.getElementById('inactiveToggle');
  var list=document.getElementById('inactiveList');
  if(!list) return;
  var showing=list.style.display!=='none';
  list.style.display=showing?'none':'block';
  if(btn) btn.textContent=showing?'Show Inactive':'Hide Inactive';
}
function renderStudents(){
  var allStudents=getWS();
  var bk=getBatchKey();
  var inactive=inactiveStudents[bk]||[];
  var active=allStudents.filter(function(s){return inactive.indexOf(s.id)===-1;});
  var inactiveList=allStudents.filter(function(s){return inactive.indexOf(s.id)!==-1;});

  var pCount=active.filter(function(s){return s.present;}).length;
  document.getElementById('totalCount').textContent=active.length;
  document.getElementById('presentCount').textContent=pCount;
  document.getElementById('absentCount').textContent=active.length-pCount;

  var html='';

  // Active students
  active.forEach(function(st){
    var p=st.present;
    var cleanPhone=(st.phone||'').replace(/[^0-9]/g,'');
    var isOpen=expandedAttId===st.id;
    var ini=initials(st.studName||st.name);

    html+='<div class="s-card">';
    // Main row
    html+='<div class="s-row" onclick="toggleAttExpand('+st.id+')" style="cursor:pointer;">';
    html+='<div style="display:flex;align-items:center;gap:12px;flex:1;">';
    html+='<div class="avatar">'+ini+'</div>';
    html+='<div class="s-info"><div class="s-name">'+(st.studName||'&#8212;')+'</div><div class="s-sub">'+(st.dob||'')+'</div></div>';
    html+='</div>';
    html+='<div class="btn-group">';
    if(!p&&cleanPhone) html+='<a class="call-link" href="tel:'+cleanPhone+'" onclick="event.stopPropagation()">&#128222;</a>';
    html+='<button class="pa-btn '+(p?'p':'a')+'" onclick="event.stopPropagation();togglePresent('+st.id+')">'+(p?'P':'A')+'</button>';
    html+='</div></div>';

    // Comment field when absent
    if(!p){
      var lastComment=getLastComment(st.id);
      html+='<div style="padding:0 14px 10px;display:flex;gap:8px;align-items:center;">';
      html+='<input type="text" id="comment_'+st.id+'" placeholder="'+(lastComment?lastComment:'Reason for absence (optional)')+'" value="'+(st.comment||'')+'" onblur="doneComment('+st.id+')" style="flex:1;padding:9px 12px;border:1.5px solid #eee;border-radius:10px;font-size:13px;font-family:inherit;outline:none;background:#fafafa;color:#111;"/>';
      html+='</div>';
    }

    // Expanded panel
    if(isOpen){
      var mc=getMonthAttCount(st.id);
      html+='<div style="border-top:1px solid #f5f5f5;padding:12px 14px;">';
      // Attendance count
      html+='<div style="background:#f8f8f8;border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;">';
      html+='<span style="font-size:13px;color:#555;font-weight:600;">This month</span>';
      html+='<span style="font-size:15px;font-weight:700;color:#111;">'+mc.attended+' / '+mc.total+' days</span>';
      html+='</div>';
      // Actions
      html+='<div style="display:flex;gap:8px;">';
      html+='<button onclick="goToProfile('+st.id+',&quot;'+session+'&quot;,&quot;'+sport+'&quot;)" style="flex:1;padding:10px;background:#f0f0ee;color:#111;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;">&#128100; View Profile</button>';
      html+='<button onclick="removeFromBatch('+st.id+')" style="flex:1;padding:10px;background:#fdecea;color:#e74c3c;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;">&#10005; Remove</button>';
      html+='</div>';
      html+='</div>';
    }
    html+='</div>';
  });



  document.getElementById('studentList').innerHTML=html;
}

function togglePresent(id){
  var ws=getWS();
  var s=ws.find(function(x){return x.id===id;});
  if(s){
    s.present=!s.present;
    if(s.present) s.comment='';
    renderStudents();
    saveAttendance();
  }
}
function setComment(id,val){
  var ws=getWS();
  var s=ws.find(function(x){return x.id===id;});
  if(s){s.comment=val;saveAttendance();}
}
function showDoneBtn(id){
  var btn=document.getElementById('done_'+id);
  if(btn) btn.style.display='block';
}
function doneComment(id){
  var el=document.getElementById('comment_'+id);
  if(el){
    var ws=getWS();
    var s=ws.find(function(x){return x.id===id;});
    if(s){s.comment=el.value;saveAttendance();}
    el.blur();
  }
}
function getLastComment(id){
  // Find last comment from attendance history for this student
  for(var i=0;i<attHistory.length;i++){
    var h=attHistory[i];
    if(h.session===session&&h.sport===sport){
      var st=h.students&&h.students.find(function(x){return x.id===id;});
      if(st&&st.comment) return st.comment;
    }
  }
  return '';
}
function toggleExpand(id){expandedId=expandedId===id?null:id;renderStudents();}
function goToProfile(id,sess,sp){
  // Try direct match first
  if(students[sess]&&students[sess][sp]&&(students[sess][sp]||[]).find(function(s){return s.id===id;})){
    openProfileDetail(id,sess,sp);
    return;
  }
  // Search across all sessions and sports
  var sessions=['morning','evening'];
  var sports=['Football','Basketball','Cricket'];
  for(var i=0;i<sessions.length;i++){
    for(var j=0;j<sports.length;j++){
      var list=(students[sessions[i]]&&students[sessions[i]][sports[j]])||[];
      if(list.find(function(s){return s.id===id;})){
        openProfileDetail(id,sessions[i],sports[j]);
        return;
      }
    }
  }
  // Not in profiles yet - show alert
  alert('Profile not found. Please add this student to Profiles first.');
}
function saveAttendance(){
  const ws=getWS();const dk=dateKey(selDate);
  attHistory=attHistory.filter(h=>!(h.date===dk&&h.session===session&&h.sport===sport));
  attHistory.push({date:dk,session,sport,students:ws.map(x=>({...x}))});
  attHistory.sort((a,b)=>b.date.localeCompare(a.date));
  saveAll();
  var badge=document.getElementById('savedBadge');
  if(badge){var t=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});badge.textContent='✓ Saved at '+t;setTimeout(function(){badge.textContent='';},4000);}
  renderStudents();
}

  // Check if existing student
  var existSt=null;
  var allSess=['morning','evening'];
  var allSp=['Football','Basketball','Cricket'];
  for(var i=0;i<allSess.length&&!existSt;i++){
    for(var j=0;j<allSp.length&&!existSt;j++){
      var l=(students[allSess[i]]&&students[allSess[i]][allSp[j]])||[];
      existSt=l.find(function(s){return (s.studName||'').toLowerCase()===studName.toLowerCase();});
      if(!existSt){
        var dl=(DEFAULT_STUDENTS[allSess[i]]&&DEFAULT_STUDENTS[allSess[i]][allSp[j]])||[];
        existSt=dl.find(function(s){return (s.studName||'').toLowerCase()===studName.toLowerCase();});
      }
    }
  }
  var sid;
  if(existSt){
    sid=existSt.id;
  } else {
    sid=nextId++;
    if(!students[se][sp]) students[se][sp]=[];
    students[se][sp].push({id:sid,name:name,studName:studName,phone:phone,dob:dob,joinDate:join,fee:'unpaid',feeAmount:feeAmt,feeType:feeType,feeHistory:[]});
  }
  // Add to today's attHistory
  var dk=dateKey(selDate);
  var rec=attHistory.find(function(h){return h.date===dk&&h.session===se&&h.sport===sp;});
  if(rec){
    if(!rec.students.find(function(s){return s.id===sid;}))
      rec.students.push({id:sid,studName:studName,present:true,comment:''});
  } else {
    var latestRec=attHistory.filter(function(h){
      return h.session===se&&h.sport===sp&&h.date<dk;
    }).sort(function(a,b){return b.date.localeCompare(a.date);})[0];
    var baseStudents=latestRec?latestRec.students.map(function(s){
      return {id:s.id,studName:s.studName,present:true,comment:''};
    }):[];
    if(!baseStudents.find(function(s){return s.id===sid;}))
      baseStudents.push({id:sid,studName:studName,present:true,comment:''});
    attHistory.push({date:dk,session:se,sport:sp,students:baseStudents});
  }
  workingState={};
  saveAll();
  closeModal();
  if(se===session&&sp===sport) renderStudents();
  renderProfiles();
}

function timeToMins(t){
  if(!t) return 0;
  var parts=t.split(' ');
  var hm=parts[0].split(':');
  var h=parseInt(hm[0]); var m=parseInt(hm[1]);
  var ampm=parts[1];
  if(ampm==='PM'&&h!==12) h+=12;
  if(ampm==='AM'&&h===12) h=0;
  return h*60+m;
}

function calcDuration(){
  var s=document.getElementById('bkStartTime');
  var e=document.getElementById('bkEndTime');
  var d=document.getElementById('bkHours');
  if(!s||!e||!d) return;
  var sv=s.value; var ev=e.value;
  if(!sv||!ev){ d.value=''; return; }
  var sm=timeToMins(sv); var em=timeToMins(ev);
  if(em<sm) em+=24*60; // overnight
  var diff=em-sm;
  var hrs=Math.floor(diff/60); var mins=diff%60;
  var label='';
  if(hrs>0) label+=hrs+' Hour'+(hrs>1?'s':'');
  if(mins>0) label+=(hrs>0?' ':'')+'& '+mins+' mins';
  d.value=label;
  // also set timeSlot display
  if(document.getElementById('bkTimeSlot')) document.getElementById('bkTimeSlot').value=sv+' to '+ev;
}

}
function addBooking(){
  var team=document.getElementById('bkTeam').value.trim();
  var phone=document.getElementById('bkPhone').value.trim();
  var sport=document.getElementById('bkSport').value;
  var date=document.getElementById('bkDate').value;
  var st=document.getElementById('bkStartTime').value;var et=document.getElementById('bkEndTime').value;
  var timeSlot=st&&et?st+' to '+et:'';
  var hours=document.getElementById('bkHours').value;
  var amount=parseInt(document.getElementById('bkAmount').value)||0;
  var ps=document.getElementById('bkPaid').value;
  var notes=document.getElementById('bkNotes').value.trim();
  if(!team){alert('Please enter team/name.');return;}
  if(!date){alert('Please select a date.');return;}
  if(!amount){alert('Please enter amount.');return;}
  var paid=(ps==='paid');var online=0;var cash=0;var balance=0;
  if(ps==='paid'){online=parseInt(document.getElementById('bkOnline').value)||0;cash=parseInt(document.getElementById('bkCash').value)||0;}
  else if(ps==='partial'){var ap=parseInt(document.getElementById('bkAmtPaid').value)||0;online=ap;balance=Math.max(0,amount-ap);}
  else{balance=amount;}
  bookings.unshift({id:nextId++,team:team,phone:phone,sport:sport,date:date,timeSlot:timeSlot,hours:hours,amount:amount,online:online,cash:cash,paid:paid,balance:balance,notes:notes,month:date.slice(0,7)});

}

function recordFeePayment(id,sess,sp){
  const amt=parseInt(document.getElementById('feeAmt').value)||0;
  const mode=document.getElementById('feeMode').value;
  const type=document.getElementById('feeTypeRec').value;
  const date=document.getElementById('feeDate').value;
  if(!amt){alert('Please enter amount.');return;}
  const st=(students[sess][sp]||[]).find(s=>s.id===id); if(!st)return;
  if(!st.feeHistory)st.feeHistory=[];
  st.feeHistory.unshift({amount:amt,mode,type,date:fmtKey(date)});
  st.fee='paid'; saveAll(); closeModal(); openProfileDetail(id,sess,sp); renderProfiles();
}
function openEditFee(id,sess,sp){
  const st=(students[sess][sp]||[]).find(s=>s.id===id); if(!st)return;
  showModal(`<div class="modal-handle"></div><div class="modal-title">Edit Fee Details</div>
    <div class="field-label">Fee Amount (₹)</div><input type="number" id="editFeeAmt" value="${st.feeAmount}"/>

    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="saveEditFee(${id},'${sess}','${sp}')">Save</button></div>`);

function saveEditFee(id,sess,sp){
  const st=(students[sess][sp]||[]).find(s=>s.id===id); if(!st)return;
  st.feeAmount=parseInt(document.getElementById('editFeeAmt').value)||st.feeAmount;
  st.feeType=document.getElementById('editFeeType').value;
  st.fee=document.getElementById('editFeeStatus').value;
  saveAll(); closeModal(); openProfileDetail(id,sess,sp); renderProfiles();
}
