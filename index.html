<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>4A Sports Academy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#EFEFEF;color:#111;-webkit-tap-highlight-color:transparent;}

/* LOGIN */
#loginScreen{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;z-index:200;}
.login-logo{width:72px;height:72px;background:#111;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:1.5rem;}
.login-title{font-size:26px;font-weight:700;color:#111;margin-bottom:4px;}
.login-sub{font-size:14px;color:#bbb;margin-bottom:2rem;}
.login-field{width:100%;max-width:320px;padding:14px 16px;border:1.5px solid #eee;border-radius:12px;font-size:16px;font-family:inherit;outline:none;margin-bottom:12px;background:#fafafa;}
.login-field:focus{border-color:#111;background:#fff;}
.login-btn{width:100%;max-width:320px;padding:15px;background:#111;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;}
.login-error{font-size:13px;color:#e74c3c;margin-top:10px;min-height:18px;text-align:center;}

/* APP SHELL */
#appShell{display:none;padding-bottom:72px;}
.screen{display:none;}
.screen.active{display:block;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:none;z-index:50;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 10px;cursor:pointer;color:#ccc;font-size:10px;font-weight:600;gap:3px;border:none;background:none;letter-spacing:0.02em;}
.nav-item.active{color:#111;}
.nav-icon{font-size:22px;line-height:1;}

/* PAGE HEADER */
.pg-header{background:#fff;padding:14px 16px 12px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10;}
.pg-label{font-size:10px;font-weight:700;color:#bbb;letter-spacing:0.12em;text-transform:uppercase;}
.pg-title{font-size:24px;font-weight:700;color:#111;margin-top:2px;}
.pg-header-row{display:flex;justify-content:space-between;align-items:flex-end;}
.add-hdr-btn{padding:7px 14px;background:#111;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.sign-out-btn{font-size:12px;color:#aaa;border:1.5px solid #eee;padding:6px 12px;border-radius:8px;background:#fff;cursor:pointer;font-family:inherit;}

/* DATE NAV */
.date-nav{display:flex;align-items:center;gap:8px;margin-top:8px;}
.date-nav-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid #eee;background:#f4f4f2;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;flex-shrink:0;}
.date-nav-btn:disabled{opacity:0.3;cursor:default;}
#dateLabel{flex:1;text-align:center;font-size:13px;font-weight:600;color:#111;}

/* SESSION TABS */
.sess-tabs{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;}
.sess-tab{flex:1;padding:10px;font-size:13px;font-weight:600;border:1.5px solid #ddd;border-radius:12px;background:#fff;color:#aaa;cursor:pointer;text-align:center;}
.sess-tab.active{background:#111;color:#fff;border-color:#111;}

/* SPORT CHIPS */
.sport-chips{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;scrollbar-width:none;}
.sport-chips::-webkit-scrollbar{display:none;}
.sport-chip{flex-shrink:0;padding:6px 18px;font-size:13px;border:1.5px solid #e8e8e8;border-radius:20px;background:#fff;color:#aaa;cursor:pointer;font-weight:500;}
.sport-chip.active{background:#f4f4f2;color:#111;border-color:#ccc;font-weight:700;}

/* SUMMARY CARDS */
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px;}
.sum-card{background:#fff;border-radius:14px;padding:14px;border:1px solid #eee;}
.sum-val{font-size:26px;font-weight:700;}
.sum-label{font-size:10px;color:#bbb;margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
.sum-card.total .sum-val{color:#111;}
.sum-card.present .sum-val{color:#27ae60;}
.sum-card.absent .sum-val{color:#e74c3c;}

/* STUDENT CARD */
.list-area{padding:0 16px;}
.s-card{background:#fff;border:1px solid #eee;border-radius:16px;margin-bottom:8px;overflow:hidden;}
.s-row{display:flex;align-items:center;padding:13px 14px;gap:12px;cursor:pointer;}
.avatar{width:42px;height:42px;border-radius:50%;background:#f4f4f2;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#666;flex-shrink:0;}
.s-info{flex:1;min-width:0;}
.s-name{font-size:15px;font-weight:600;color:#111;}
.s-sub{font-size:12px;color:#bbb;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-group{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.pa-btn{width:44px;height:44px;border-radius:12px;border:none;cursor:pointer;font-size:17px;font-weight:800;}
.pa-btn.p{background:#111;color:#fff;}
.pa-btn.a{background:#ffe5e5;color:#e74c3c;}
.call-link{width:44px;height:44px;border-radius:12px;background:#fff0f0;display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;}
.expand-panel{padding:0 14px 14px;border-top:1px solid #f5f5f5;}
.d-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f8f8f8;}
.d-row:last-child{border:none;}
.d-key{font-size:12px;color:#bbb;}
.d-val{font-size:13px;font-weight:500;color:#111;}

/* ADD STUDENT BTN */
.add-student-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:4px 0 16px;padding:14px;border:1.5px dashed #ddd;border-radius:14px;background:#fff;color:#bbb;font-size:14px;font-weight:500;cursor:pointer;}

/* SAVE BAR */
.save-bar{position:fixed;bottom:72px;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:9;}
.saved-msg{flex:1;font-size:12px;color:#27ae60;font-weight:600;}
.save-btn{padding:12px 24px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}

/* DASHBOARD */
.dash-hero{background:#111;margin:14px 16px;border-radius:18px;padding:18px;color:#fff;}
.dash-date{font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:4px;}
.dash-name{font-size:20px;font-weight:700;}
.dash-quote{font-size:12px;color:rgba(255,255,255,0.45);margin-top:10px;line-height:1.6;font-style:italic;}
.dash-section{padding:0 16px 4px;}
.dash-section-title{font-size:10px;font-weight:700;color:#bbb;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px;margin-top:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.stat-card{background:#fff;border-radius:14px;padding:14px;border:1px solid #eee;}
.stat-num{font-size:24px;font-weight:700;}
.stat-num.green{color:#27ae60;}
.stat-num.red{color:#e74c3c;}
.stat-num.amber{color:#e67e22;}
.stat-num.dark{color:#111;}
.stat-num.blue{color:#2980b9;}
.stat-label{font-size:10px;color:#bbb;margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
.batch-card{background:#fff;border:1px solid #eee;border-radius:14px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.bc-name{font-size:14px;font-weight:600;color:#111;}
.bc-sub{font-size:12px;color:#bbb;margin-top:2px;}
.bc-bar{height:3px;background:#eee;border-radius:2px;margin-top:8px;width:120px;}
.bc-fill{height:3px;background:#27ae60;border-radius:2px;}
.bc-count{font-size:22px;font-weight:700;color:#27ae60;}
.bc-total{font-size:11px;color:#bbb;text-align:right;}

/* PROFILES */
.search-bar{padding:10px 16px;background:#fff;border-bottom:1px solid #eee;}
.search-input{width:100%;padding:11px 14px;border:1.5px solid #eee;border-radius:12px;font-size:14px;background:#f7f7f5;color:#111;outline:none;font-family:inherit;}
.filter-row{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{flex-shrink:0;padding:5px 14px;font-size:12px;border:1.5px solid #eee;border-radius:20px;background:#fff;color:#aaa;cursor:pointer;font-weight:500;}
.filter-chip.active{background:#111;color:#fff;border-color:#111;}
.profile-list{padding:12px 16px;}
.profile-card{background:#fff;border:1px solid #eee;border-radius:16px;margin-bottom:8px;overflow:hidden;cursor:pointer;}
.profile-row{display:flex;align-items:center;padding:13px 14px;gap:12px;}
.profile-info{flex:1;min-width:0;}
.profile-name{font-size:15px;font-weight:600;color:#111;}
.profile-sub{font-size:12px;color:#bbb;margin-top:2px;}
.fee-pill{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.fee-pill.paid{background:#e8f5e9;color:#27ae60;}
.fee-pill.unpaid{background:#fdecea;color:#e74c3c;}
.fee-pill.partial{background:#fff3e0;color:#e67e22;}

/* PROFILE DETAIL */
#profileDetail{position:fixed;inset:0;background:#EFEFEF;z-index:100;display:none;overflow-y:auto;padding-bottom:2rem;}
.detail-header{background:#fff;padding:14px 16px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;}
.back-btn{width:36px;height:36px;border:1.5px solid #eee;border-radius:10px;background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;}
.detail-hero{background:#111;margin:14px 16px;border-radius:16px;padding:18px;color:#fff;display:flex;align-items:center;gap:14px;}
.detail-avatar{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;}
.detail-stud-name{font-size:18px;font-weight:700;}
.detail-stud-sub{font-size:13px;color:rgba(255,255,255,0.55);margin-top:3px;}
.info-card{background:#fff;border:1px solid #eee;border-radius:14px;margin:0 16px 12px;overflow:hidden;}
.info-card-title{font-size:10px;font-weight:700;color:#bbb;letter-spacing:0.1em;text-transform:uppercase;padding:12px 14px 8px;border-bottom:1px solid #f5f5f5;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f8f8f8;}
.info-row:last-child{border:none;}
.info-key{font-size:13px;color:#aaa;}
.info-val{font-size:13px;font-weight:500;text-align:right;color:#111;}
.fee-action-row{display:flex;gap:8px;padding:0 16px 12px;}
.fee-action-btn{flex:1;padding:12px;border:1.5px solid #ddd;border-radius:12px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;}
.fee-action-btn.primary{background:#111;color:#fff;border-color:#111;}
.fee-history-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f8f8f8;}
.fee-history-row:last-child{border:none;}
.fhr-amount{font-size:14px;font-weight:700;color:#27ae60;}
.fhr-date{font-size:12px;color:#bbb;margin-top:1px;}
.fhr-mode{font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;background:#f4f4f2;color:#555;}
.profile-tab-row{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;scrollbar-width:none;}
.profile-tab-row::-webkit-scrollbar{display:none;}
.ptab{flex-shrink:0;padding:7px 16px;font-size:13px;font-weight:500;border:1.5px solid #ddd;border-radius:20px;background:#fff;color:#aaa;cursor:pointer;}
.ptab.active{background:#111;color:#fff;border-color:#111;}

/* SKILLS */
.perf-section{padding:14px 16px;}
.perf-title{font-size:10px;font-weight:700;color:#bbb;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px;}
.skill-row{display:flex;align-items:center;margin-bottom:12px;}
.skill-name{font-size:13px;color:#111;width:100px;flex-shrink:0;}
.skill-stars{display:flex;gap:4px;flex:1;}
.star{font-size:22px;cursor:pointer;}
.skill-val{font-size:12px;font-weight:700;color:#bbb;width:28px;text-align:right;}
.month-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:14px;}
.month-tabs::-webkit-scrollbar{display:none;}
.month-tab{flex-shrink:0;padding:6px 14px;font-size:12px;border:1.5px solid #ddd;border-radius:20px;background:#fff;color:#aaa;cursor:pointer;}
.month-tab.active{background:#111;color:#fff;border-color:#111;}
.prog-bar-wrap{margin-bottom:10px;}
.prog-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
.prog-label span:first-child{color:#aaa;}
.prog-label span:last-child{font-weight:600;color:#111;}
.prog-track{height:6px;background:#eee;border-radius:3px;overflow:hidden;}
.prog-fill{height:6px;border-radius:3px;}
.quarter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
.quarter-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:10px 8px;text-align:center;}
.quarter-label{font-size:10px;color:#bbb;font-weight:600;text-transform:uppercase;margin-bottom:4px;}
.quarter-score{font-size:18px;font-weight:700;color:#111;}
.quarter-sub{font-size:10px;color:#bbb;margin-top:1px;}
.trend-up{color:#27ae60;}
.trend-down{color:#e74c3c;}
.trend-same{color:#bbb;}

/* REPORT CARD */
#reportCardView{position:fixed;inset:0;background:#EFEFEF;z-index:200;display:none;overflow-y:auto;padding-bottom:2rem;}
.rc-header{background:#111;padding:1.5rem 1rem;text-align:center;color:#fff;}
.rc-logo{font-size:36px;margin-bottom:6px;}
.rc-academy{font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.5);}
.rc-title{font-size:20px;font-weight:700;margin-top:4px;}
.rc-period{font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;}
.rc-student-block{background:#fff;margin:14px 16px;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;}
.rc-avatar{width:52px;height:52px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;}
.rc-stud-name{font-size:17px;font-weight:700;}
.rc-stud-sub{font-size:12px;color:#bbb;margin-top:2px;}
.rc-skill-block{background:#fff;margin:0 16px 12px;border-radius:14px;padding:14px;}
.rc-skill-title{font-size:10px;font-weight:700;color:#bbb;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px;}
.rc-skill-item{margin-bottom:12px;}
.rc-skill-label{display:flex;justify-content:space-between;margin-bottom:4px;}
.rc-skill-label span:first-child{font-size:13px;color:#111;font-weight:500;}
.rc-skill-label span:last-child{font-size:12px;font-weight:700;color:#111;}
.rc-track{height:8px;background:#eee;border-radius:4px;overflow:hidden;}
.rc-fill{height:8px;border-radius:4px;}
.rc-overall{background:#111;margin:0 16px 12px;border-radius:14px;padding:14px;text-align:center;color:#fff;}
.rc-overall-num{font-size:48px;font-weight:700;}
.rc-overall-label{font-size:12px;color:rgba(255,255,255,0.5);margin-top:4px;text-transform:uppercase;letter-spacing:0.06em;}
.rc-grade{font-size:18px;font-weight:700;margin-top:8px;}
.rc-note{background:#fff;margin:0 16px 12px;border-radius:14px;padding:14px;}
.rc-note-label{font-size:10px;font-weight:700;color:#bbb;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;}
.rc-note-text{font-size:14px;color:#111;line-height:1.6;}
.rc-close-btn{margin:0 16px;width:calc(100% - 32px);padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}

/* INQUIRIES */
.inq-list{padding:12px 16px;}
.inq-card{background:#fff;border:1px solid #eee;border-radius:16px;margin-bottom:8px;padding:14px;}
.inq-top{display:flex;justify-content:space-between;align-items:flex-start;}
.inq-name{font-size:15px;font-weight:600;color:#111;}
.inq-sport{font-size:12px;color:#bbb;margin-top:2px;}
.inq-status{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;flex-shrink:0;}
.inq-status.new{background:#e8f0fe;color:#2980b9;}
.inq-status.called{background:#e8f5e9;color:#27ae60;}
.inq-status.admitted{background:#f3e8fd;color:#8e44ad;}
.inq-status.notinterested{background:#f5f5f5;color:#aaa;}
.inq-bottom{margin-top:10px;display:flex;justify-content:space-between;align-items:center;}
.inq-phone{font-size:13px;color:#2980b9;font-weight:600;text-decoration:none;}
.inq-date{font-size:11px;color:#ccc;}
.inq-notes{font-size:12px;color:#aaa;margin-top:6px;line-height:1.5;}
.status-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.status-btn{font-size:11px;padding:5px 12px;border:1.5px solid #eee;border-radius:20px;background:#fff;cursor:pointer;font-family:inherit;color:#aaa;font-weight:500;}
.status-btn.active-btn{background:#111;color:#fff;border-color:#111;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;display:none;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:1rem 1.25rem 2rem;width:100%;max-height:90vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 1rem;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:1rem;color:#111;}
.field-label{font-size:12px;font-weight:600;color:#aaa;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.05em;}
.modal input,.modal select,.modal textarea{width:100%;padding:12px 14px;border:1.5px solid #eee;border-radius:12px;font-size:15px;font-family:inherit;outline:none;color:#111;background:#fafafa;margin-bottom:14px;}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#111;}
.modal textarea{resize:none;height:80px;}
.modal-btns{display:flex;gap:8px;margin-top:4px;}
.btn-cancel{flex:1;padding:13px;border:1.5px solid #eee;border-radius:12px;background:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;color:#aaa;}
.btn-save{flex:2;padding:13px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-logo">🏆</div>
  <div class="login-title">4A Sports Academy</div>
  <div class="login-sub">Admin Portal</div>
  <input class="login-field" type="email" id="loginUser" placeholder="Email address" autocomplete="email"/>
  <input class="login-field" type="password" id="loginPass" placeholder="Password"/>
  <button class="login-btn" onclick="doLogin()">Sign In</button>
  <div class="login-error" id="loginError"></div>
</div>

<!-- APP -->
<div id="appShell">

  <!-- DASHBOARD -->
  <div class="screen active" id="screen-dashboard">
    <div class="pg-header">
      <div class="pg-label">4A Sports Academy</div>
      <div class="pg-header-row">
        <div class="pg-title" id="dashGreeting">Dashboard</div>
        <button class="sign-out-btn" onclick="doLogout()">Sign out</button>
      </div>
    </div>
    <div id="dashContent"></div>
  </div>

  <!-- ATTENDANCE -->
  <div class="screen" id="screen-attendance">
    <div class="pg-header">
      <div class="pg-label">4A Sports Academy</div>
      <div class="pg-title">Attendance</div>
      <div class="date-nav">
        <button class="date-nav-btn" onclick="changeDate(-1)">&#8249;</button>
        <div id="dateLabel"></div>
        <button class="date-nav-btn" id="nextDateBtn" onclick="changeDate(1)">&#8250;</button>
      </div>
    </div>
    <div class="sess-tabs">
      <div class="sess-tab active" onclick="switchSession('morning',this)">&#9728; Morning</div>
      <div class="sess-tab" onclick="switchSession('evening',this)">&#127748; Evening</div>
    </div>
    <div class="sport-chips" id="sportChips"></div>
    <div class="summary-grid">
      <div class="sum-card total"><div class="sum-val" id="totalCount">0</div><div class="sum-label">Total</div></div>
      <div class="sum-card present"><div class="sum-val" id="presentCount">0</div><div class="sum-label">Present</div></div>
      <div class="sum-card absent"><div class="sum-val" id="absentCount">0</div><div class="sum-label">Absent</div></div>
    </div>

function initials(n){return(n||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function keyToDate(k){const[y,m,d]=k.split('-');return new Date(+y,+m-1,+d);}
function fmtKey(k){return keyToDate(k).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
function fmtMoney(n){return '₹'+Number(n).toLocaleString('en-IN');}
function calcAge(dob){if(!dob)return null;const p=dob.split('/');if(p.length!==3)return null;const d=new Date(+p[2],+p[1]-1,+p[0]);if(isNaN(d))return null;const t=new Date();let a=t.getFullYear()-d.getFullYear();const m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a;}
function calcCategory(dob){const a=calcAge(dob);if(a===null)return null;if(a<=8)return{label:'Under-8',short:'U8',color:'#2980b9',bg:'#e8f0fe'};if(a<=10)return{label:'Under-10',short:'U10',color:'#27ae60',bg:'#e8f5e9'};if(a<=12)return{label:'Under-12',short:'U12',color:'#e67e22',bg:'#fff3e0'};if(a<=14)return{label:'Under-14',short:'U14',color:'#e74c3c',bg:'#fdecea'};if(a<=16)return{label:'Under-16',short:'U16',color:'#8e44ad',bg:'#f3e8fd'};if(a<=18)return{label:'Under-18',short:'U18',color:'#00695c',bg:'#e0f2f1'};return{label:'Senior',short:'SR',color:'#555',bg:'#f4f4f2'};}

function getMonthKey(offset=0){const d=new Date();d.setMonth(d.getMonth()-offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function fmtMonthKey(key){const[y,m]=key.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-IN',{month:'short',year:'numeric'});}

  el.classList.add('active');
  renderSportChips(); renderStudents();
}
function renderSportChips(){
  document.getElementById('sportChips').innerHTML=BATCHES[session].map(b=>`<div class="sport-chip${sport===b?' active':''}" onclick="selectSport('${b}')">${b}</div>`).join('');
}
function selectSport(s){sport=s;expandedId=null;renderSportChips();renderStudents();}

function wsKey(){return dateKey(selDate)+'_'+session+'_'+sport;}
function getWS(){
  const k=wsKey();
  if(!workingState[k]){
    const saved=attHistory.find(h=>h.date===dateKey(selDate)&&h.session===session&&h.sport===sport);
    workingState[k]=(students[session][sport]||[]).map(st=>{
      const snap=saved?saved.students.find(x=>x.id===st.id):null;
      return{id:st.id,present:snap?snap.present:true,comment:snap?snap.comment:''};
    });
  }
  return workingState[k];
}

function renderStudents(){
  const list=(students[session][sport]||[]);
  const ws=getWS();
  const merged=list.map(st=>{const w=ws.find(x=>x.id===st.id)||{present:true,comment:''};return{...st,...w};});
  const pCount=merged.filter(s=>s.present).length;
  document.getElementById('totalCount').textContent=list.length;
  document.getElementById('presentCount').textContent=pCount;
  document.getElementById('absentCount').textContent=list.length-pCount;
  let html='';
  merged.forEach(st=>{
    const p=st.present, open=expandedId===st.id;
    const cleanPhone=(st.phone||'').replace(/[^0-9]/g,'');
    const callBtn=(!p&&cleanPhone)?`<a class="call-link" href="tel:${cleanPhone}" onclick="event.stopPropagation()">&#128222;</a>`:'';
    html+=`<div class="s-card">
      <div class="s-row" onclick="toggleExpand(${st.id})">
        <div class="avatar">${initials(st.studName||st.name)}</div>
        <div class="s-info"><div class="s-name">${st.studName||'—'}</div><div class="s-sub">${st.dob||''}</div></div>
        <div class="btn-group">${callBtn}<button class="pa-btn ${p?'p':'a'}" onclick="event.stopPropagation();togglePresent(${st.id})">${p?'P':'A'}</button></div>
      </div>
      ${open?`<div class="expand-panel">
        <div class="d-row"><span class="d-key">Parent</span><span class="d-val">${st.name}</span></div>
        <div class="d-row"><span class="d-key">Phone</span><span class="d-val">${st.phone||'—'}</span></div>
        <div class="d-row"><span class="d-key">DOB</span><span class="d-val">${st.dob||'—'}</span></div>
      </div>`:''}
    </div>`;
  });
  html+=`<button class="add-student-btn" onclick="openModal('addStudent')">+ Add Student</button>`;
  document.getElementById('studentList').innerHTML=html;
}

function togglePresent(id){const ws=getWS();const s=ws.find(x=>x.id===id);if(s){s.present=!s.present;renderStudents();}}
function toggleExpand(id){expandedId=expandedId===id?null:id;renderStudents();}
function saveAttendance(){
  const ws=getWS();const dk=dateKey(selDate);
  attHistory=attHistory.filter(h=>!(h.date===dk&&h.session===session&&h.sport===sport));
  attHistory.push({date:dk,session,sport,students:ws.map(x=>({...x}))});
  attHistory.sort((a,b)=>b.date.localeCompare(a.date));
  saveAll();
  const t=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('savedBadge').textContent='✓ Saved at '+t;
  setTimeout(()=>{document.getElementById('savedBadge').textContent='';},4000);
  renderStudents();
}

function generateReportCard(){
  const id=currentProfileId,sess=currentProfileSess,sp=currentProfileSport;
  const st=(students[sess][sp]||[]).find(s=>s.id===id); if(!st)return;
  const perf=ensurePerf(st); const cat=calcCategory(st.dob); const skills=SPORT_SKILLS[sp]||[];
  let latestMonth=null,latestData=null;
  for(let i=0;i<12;i++){const m=getMonthKey(i);if(perf.monthly[m]&&skills.some(s=>perf.monthly[m][s])){latestMonth=m;latestData=perf.monthly[m];break;}}
  let totalScore=0,ratedCount=0;
  if(latestData)skills.forEach(s=>{if(latestData[s]){totalScore+=latestData[s];ratedCount++;}});
  const avg=ratedCount>0?(totalScore/ratedCount):0;
  const avgPct=Math.round(avg/5*100);
  const grade=avgPct>=90?'A+':avgPct>=80?'A':avgPct>=70?'B+':avgPct>=60?'B':avgPct>=50?'C':'D';
  const gradeColor=avgPct>=70?'#27ae60':avgPct>=50?'#e67e22':'#e74c3c';
  const skillBars=skills.map(skill=>{const val=latestData?latestData[skill]||0:0;const pct=Math.round(val/5*100);const color=pct>=80?'#27ae60':pct>=60?'#e67e22':pct>=40?'#2980b9':'#eee';return`<div class="rc-skill-item"><div class="rc-skill-label"><span>${skill}</span><span>${val>0?val+'/5':'Not rated'}</span></div><div class="rc-track"><div class="rc-fill" style="width:${pct}%;background:${color};"></div></div></div>`;}).join('');
  const note=latestData?latestData.note||'':'';
  const period=latestMonth?fmtMonthKey(latestMonth):'No data yet';
  document.getElementById('reportCardContent').innerHTML=`
    <div class="rc-header"><div class="rc-logo">🏆</div><div class="rc-academy">4A Sports Academy</div><div class="rc-title">Player Report Card</div><div class="rc-period">${period}</div></div>
    <div class="rc-student-block"><div class="rc-avatar">${initials(st.studName||st.name)}</div><div><div class="rc-stud-name">${st.studName||'—'}</div><div class="rc-stud-sub">${sess==='morning'?'Morning':'Evening'} · ${sp}</div><div class="rc-stud-sub">Parent: ${st.name}</div>${cat?`<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:${cat.bg};color:${cat.color};margin-top:4px;display:inline-block;">${cat.label}</span>`:''}</div></div>
    ${ratedCount>0?`<div class="rc-overall"><div class="rc-overall-num">${avg.toFixed(1)}<span style="font-size:20px;">/5</span></div><div class="rc-overall-label">Overall Score</div><div class="rc-grade" style="color:${gradeColor};">Grade: ${grade}</div></div><div class="rc-skill-block"><div class="rc-skill-title">Skills Breakdown</div>${skillBars}</div>`:'<div style="text-align:center;padding:2rem;color:#bbb;font-size:14px;">Rate skills in the Skills tab first.</div>'}
    ${note?`<div class="rc-note"><div class="rc-note-label">Coach Notes</div><div class="rc-note-text">${note}</div></div>`:''}
    <div style="margin:0 16px 12px;padding:14px;background:#fff;border:1px solid #eee;border-radius:14px;font-size:12px;color:#bbb;text-align:center;">Generated by 4A Sports Academy · ${new Date().toLocaleDateString('en-IN')}</div>`;
  document.getElementById('reportCardView').style.display='block';
}

    const all=[...new Set([...BATCHES.morning,...BATCHES.evening])];
    showModal(`<div class="modal-handle"></div><div class="modal-title">Add New Student</div>
      <div class="field-label">Student Name</div><input type="text" id="newStudName" placeholder="e.g. Josith Rakshan"/>
      <div class="field-label">Parent Name</div><input type="text" id="newName" placeholder="e.g. Ashok"/>
      <div class="field-label">Parent Phone</div><input type="tel" id="newPhone" placeholder="e.g. 9876543210"/>
      <div class="field-label">Date of Birth</div><input type="text" id="newDob" placeholder="e.g. 14/02/2018"/>
      <div class="field-label">Join Date</div><input type="text" id="newJoin" placeholder="e.g. 01/06/2025"/>
      <div class="field-label">Sport</div><select id="newSport">${all.map(s=>`<option>${s}</option>`).join('')}</select>
      <div class="field-label">Session</div><select id="newSession"><option value="morning">Morning</option><option value="evening">Evening</option></select>
      <div class="field-label">Fee Amount (₹)</div><input type="number" id="newFeeAmt" value="2000"/>
      <div class="field-label">Fee Type</div><select id="newFeeType"><option value="monthly">Monthly</option><option value="yearly">Yearly</option><option value="onetime">One-time</option></select>
      <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="addStudent()">Add Student</button></div>`);
    document.getElementById('newSport').value=sport;document.getElementById('newSession').value=session;
  }
  if(type==='addInquiry'){
    showModal(`<div class="modal-handle"></div><div class="modal-title">New Inquiry</div>
      <div class="field-label">Name</div><input type="text" id="inqName" placeholder="Parent or student name"/>
      <div class="field-label">Phone</div><input type="tel" id="inqPhone" placeholder="e.g. 9876543210"/>
      <div class="field-label">Sport Interested In</div><select id="inqSport">${ALL_SPORTS.map(s=>`<option>${s}</option>`).join('')}</select>
      <div class="field-label">Preferred Session</div><select id="inqSession"><option value="morning">Morning</option><option value="evening">Evening</option></select>
      <div class="field-label">Notes</div><textarea id="inqNotes" placeholder="Any notes..."></textarea>
      <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="addInquiry()">Save</button></div>`);
  }
}
function addStudent(){
  const studName=document.getElementById('newStudName').value.trim();
  const name=document.getElementById('newName').value.trim();
  const phone=document.getElementById('newPhone').value.trim();
  const dob=document.getElementById('newDob').value.trim();
  const join=document.getElementById('newJoin').value.trim();
  const sp=document.getElementById('newSport').value;
  const se=document.getElementById('newSession').value;
  const feeAmt=parseInt(document.getElementById('newFeeAmt').value)||2000;
  const feeType=document.getElementById('newFeeType').value;
  if(!studName){alert('Please enter student name.');return;}
  if(!students[se][sp])students[se][sp]=[];
  students[se][sp].push({id:nextId++,name,studName,phone,dob,joinDate:join,fee:'unpaid',feeAmount:feeAmt,feeType,feeHistory:[]});
  saveAll();closeModal();
  if(se===session&&sp===sport)renderStudents();
  renderProfiles();
}
function addInquiry(){
  const name=document.getElementById('inqName').value.trim();
  const phone=document.getElementById('inqPhone').value.trim();
  const sp=document.getElementById('inqSport').value;
  const se=document.getElementById('inqSession').value;
  const notes=document.getElementById('inqNotes').value.trim();
  if(!name){alert('Please enter a name.');return;}
  const today=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'});
  inquiries.unshift({id:nextId++,name,phone,sport:sp,session:se,status:'new',notes,date:today});
  saveAll();closeModal();renderInquiries();renderInqFilters();
}
function openRecordFee(id,sess,sp){
  showModal(`<div class="modal-handle"></div><div class="modal-title">Record Payment</div>
    <div class="field-label">Amount (₹)</div><input type="number" id="feeAmt" placeholder="e.g. 2000"/>
    <div class="field-label">Payment Mode</div><select id="feeMode"><option value="Cash">Cash</option><option value="Online">Online (UPI/Bank)</option></select>
    <div class="field-label">Type</div><select id="feeTypeRec"><option value="Monthly">Monthly</option><option value="Yearly">Yearly</option><option value="One-time">One-time</option></select>
    <div class="field-label">Date</div><input type="date" id="feeDate" value="${todayKey()}"/>
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="recordFeePayment(${id},'${sess}','${sp}')">Save</button></div>`);
}
function recordFeePayment(id,sess,sp){
  const amt=parseInt(document.getElementById('feeAmt').value)||0;
  const mode=document.getElementById('feeMode').value;
  const type=document.getElementById('feeTypeRec').value;
  const date=document.getElementById('feeDate').value;
  if(!amt){alert('Please enter amount.');return;}
  const st=(students[sess][sp]||[]).find(s=>s.id===id); if(!st)return;
  if(!st.feeHistory)st.feeHistory=[];
  st.feeHistory.unshift({amount:amt,mode,type,date:fmtKey(date)});
  st.fee='paid'; saveAll(); closeModal(); openProfileDetail(id,sess,sp); renderProfiles();
}
function openEditFee(id,sess,sp){
  const st=(students[sess][sp]||[]).find(s=>s.id===id); if(!st)return;
  showModal(`<div class="modal-handle"></div><div class="modal-title">Edit Fee Details</div>
    <div class="field-label">Fee Amount (₹)</div><input type="number" id="editFeeAmt" value="${st.feeAmount}"/>
    <div class="field-label">Fee Type</div><select id="editFeeType"><option value="monthly"${st.feeType==='monthly'?' selected':''}>Monthly</option><option value="yearly"${st.feeType==='yearly'?' selected':''}>Yearly</option><option value="onetime"${st.feeType==='onetime'?' selected':''}>One-time</option></select>
    <div class="field-label">Fee Status</div><select id="editFeeStatus"><option value="paid"${st.fee==='paid'?' selected':''}>Paid</option><option value="partial"${st.fee==='partial'?' selected':''}>Partial</option><option value="unpaid"${st.fee==='unpaid'?' selected':''}>Unpaid</option></select>
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="saveEditFee(${id},'${sess}','${sp}')">Save</button></div>`);
}
function saveEditFee(id,sess,sp){
  const st=(students[sess][sp]||[]).find(s=>s.id===id); if(!st)return;
  st.feeAmount=parseInt(document.getElementById('editFeeAmt').value)||st.feeAmount;
  st.feeType=document.getElementById('editFeeType').value;
  st.fee=document.getElementById('editFeeStatus').value;
  saveAll(); closeModal(); openProfileDetail(id,sess,sp); renderProfiles();
}

// ── EXPOSE TO WINDOW ───────────────────────────────────
window.doLogin=doLogin; window.doLogout=doLogout; window.showScreen=showScreen;
window.switchSession=switchSession; window.selectSport=selectSport;
window.changeDate=changeDate; window.togglePresent=togglePresent;
window.toggleExpand=toggleExpand; window.saveAttendance=saveAttendance;
window.openModal=openModal; window.closeModal=closeModal;
window.addStudent=addStudent; window.addInquiry=addInquiry;
window.setProfileFilter=setProfileFilter; window.filterProfiles=filterProfiles;
window.openProfileDetail=openProfileDetail; window.closeProfileDetail=closeProfileDetail;
window.switchProfileTab=switchProfileTab; window.selectMonth=selectMonth;
window.updatePerf=updatePerf; window.rateStar=rateStar;
window.saveCoachNote=saveCoachNote; window.saveAllSkills=saveAllSkills;
window.openRecordFee=openRecordFee; window.recordFeePayment=recordFeePayment;
window.openEditFee=openEditFee; window.saveEditFee=saveEditFee;
window.generateReportCard=generateReportCard; window.closeReportCard=closeReportCard;
window.setInqFilter=setInqFilter; window.setInqStatus=setInqStatus; window.deleteInq=deleteInq;
</script>
</body>
